<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ponto Eletrônico · Shine Rio Group</title>
<meta name="theme-color" content="#2fcdb6">
<style>
:root{--bg:#eef9f9;--card:#fff;--tx:#14363f;--mut:#56727a;--pri:#087c8c;--pri2:#06626f;--ok:#12805a;--ex:#b45f00;--bd:#d5ecec;--soft:#e4f6f5;--grad:linear-gradient(115deg,#2fd0b5 0%,#3cc4c9 50%,#45b5df 100%)}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100vh}
header{background:var(--pri);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.clock{text-align:center;margin:10px 0 22px}
.clock .t{font-size:44px;font-weight:700;letter-spacing:1px}
.clock .d{color:var(--mut)}.clock .d::first-letter{text-transform:uppercase}
h2{font-size:18px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.emp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;transition:.15s}
.emp:hover{border-color:var(--pri);transform:translateY(-2px)}
.av{width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin:0 auto 8px;flex:none}
.emp b{display:block;font-size:15px}.emp small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.big{width:100%;padding:18px;font-size:19px;font-weight:700;border:0;border-radius:12px;background:var(--pri);color:#fff;cursor:pointer}
.big:hover{background:var(--pri2)}
.big.ok{background:var(--ok)}
.big.ex{background:var(--ex)}
.btn{border:1px solid var(--bd);background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.d{color:#b00020}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font-size:15px;margin-top:4px;background:#fff}
label{font-size:13px;color:var(--mut);display:block;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
.wrap{overflow-x:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1;min-width:120px}
.msg{background:#e8f7ef;color:#0c6b3b;padding:10px;border-radius:8px;margin-bottom:12px;text-align:center}
.warn{background:#fff4e0;color:#8a5200}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#eef1f7}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:110px;padding:10px;border:1px solid var(--bd);background:#fff;border-radius:8px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sched{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.sched div{background:#f4f6fb;border-radius:8px;padding:8px 2px;font-size:12px;color:var(--mut)}
.sched b{display:block;font-size:17px;color:var(--tx);margin-top:2px}
.wk input{padding:6px 4px;font-size:13px;margin:0;min-width:84px}
.wk td,.wk th{padding:4px 3px}
.ext{color:var(--ex);font-weight:700}
.neg{color:#b00020}.pos{color:var(--ok)}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-size:14px}

/* ---------- identidade Shine Rio ---------- */
*{font-family:"Nunito","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{background:var(--grad);padding:12px 20px;gap:12px;position:relative}
header .brand{background:none;padding:0;display:flex;align-items:center;gap:14px}
header .brand img{height:48px;display:block}
header h1{font-size:14px;font-weight:700;border-left:2px solid rgba(255,255,255,.6);padding-left:14px;line-height:1.25;color:#073f48}
header #btnAdmin{background:#fff;color:var(--pri2);border-radius:30px;padding:10px 16px;font-weight:700}
main{width:100%;flex:1;padding-bottom:36px}
.hero{background:var(--grad);border-radius:24px;padding:30px 20px 26px;text-align:center;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 10px 28px rgba(20,150,165,.22)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(svg){position:relative}
.hero img{width:min(270px,76%);display:block;margin:0 auto 14px}
.slogan{display:inline-block;background:#fff;color:var(--pri2);font-weight:800;font-size:15px;padding:9px 18px;border-radius:30px;line-height:1.35}
.hero .clock{margin:18px 0 0;color:#06363e}
.hero .clock .d{color:#06363e;font-weight:600}
.clock .t{font-variant-numeric:tabular-nums;color:var(--pri2)}
.hero .clock .t{color:#06363e}
h2{color:var(--pri2)}
.hello{text-align:center;margin-bottom:16px}.hello h2{font-size:22px;margin-bottom:2px}.hello p{color:var(--mut)}
.card{border-radius:20px;box-shadow:0 4px 16px rgba(20,120,135,.07)}
.emp{border-radius:20px;padding:20px 10px 16px;box-shadow:0 4px 14px rgba(20,120,135,.08);color:var(--tx);font-size:inherit}
.emp:hover,.emp:focus-visible{border-color:#2fd0b5;transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,150,165,.2)}
.av{background:var(--grad);color:#06363e;width:62px;height:62px;font-size:25px;box-shadow:0 0 0 4px var(--soft)}
.emp .go{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--pri2);background:var(--soft);padding:5px 12px;border-radius:20px}
.profile{background:var(--grad);border:0;color:#06363e;padding:20px;gap:16px}
.profile .av{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.45)}
.big{border-radius:40px;box-shadow:0 8px 20px rgba(8,124,140,.28)}
.big.ok:hover,.big.ex:hover{filter:brightness(.92)}
.big.ok:hover{background:var(--ok)}.big.ex:hover{background:var(--ex)}
.btn{border-radius:30px;color:var(--tx);font-weight:600}.btn.p{color:#fff}.btn.d{color:#b00020}
.btn:hover{border-color:var(--pri)}
input,select,textarea{border-radius:12px;color:var(--tx)}
:focus-visible{outline:3px solid #45b5df;outline-offset:2px}
.tabs button{border-radius:30px;color:var(--tx);font-weight:600}.tabs button.on{color:#fff}
.sched div{background:var(--soft);border-radius:14px}
.tag{background:var(--soft)}
.msg{border-radius:16px;font-weight:600}
footer{background:var(--grad);color:#06363e;text-align:center;padding:20px 16px;font-size:13px}
footer b{display:block;font-size:15px;margin-bottom:3px}
@media(max-width:520px){header{padding:10px 12px}header h1{display:none}header .brand img{height:42px}.sched[style*="repeat(4"]{grid-template-columns:repeat(2,1fr)!important}.clock .t{font-size:40px}}

/* ---------- teclado de PIN ---------- */
body.pin-lock{overflow:hidden}
.pin-ov{position:fixed;inset:0;z-index:1000;display:flex;padding:16px;overflow-y:auto;background:rgba(6,54,62,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:pinFade .25s ease both}
.pin-ov.out{animation:pinFadeOut .22s ease both;pointer-events:none}
.pin-card{position:relative;width:100%;max-width:340px;margin:auto;background:var(--card);color:var(--tx);border-radius:28px;padding:30px 22px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,40,50,.35);overflow:hidden;animation:pinPop .4s cubic-bezier(.2,1.2,.3,1) both}
.pin-card:focus{outline:none}
.pin-card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--grad)}
.pin-ov.out .pin-card{animation:pinPopOut .22s ease both}
.pin-av{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--grad);color:#06363e;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;box-shadow:0 0 0 5px var(--soft);animation:pinAv .5s .1s cubic-bezier(.2,1.4,.3,1) both;transition:background .25s,color .25s}
.pin-card.ok .pin-av{background:var(--ok);color:#fff;animation:pinCheck .45s cubic-bezier(.2,1.4,.3,1) both}
.pin-card h3{font-size:19px;color:var(--pri2)}
.pin-sub{color:var(--mut);font-size:14px;margin:4px 0 18px;min-height:20px;transition:color .2s}
.pin-sub.err{color:#c62828;font-weight:700}
.pin-sub.good{color:var(--ok);font-weight:700}
.pin-dots{display:flex;gap:14px;justify-content:center;align-items:center;height:22px;margin-bottom:22px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri);background:transparent;transition:transform .18s cubic-bezier(.2,1.7,.4,1),background .15s,border-color .15s}
.pin-dots i.on{background:var(--pri);transform:scale(1.2)}
.pin-dots.err i{background:#d32f2f;border-color:#d32f2f}
.pin-dots.shake{animation:pinShake .45s}
.pin-dots.ok i{background:var(--ok);border-color:var(--ok);animation:pinOk .45s calc(var(--d)*60ms) both}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
.pin-keys button{width:68px;height:68px;border-radius:50%;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font-size:26px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .15s,color .15s,border-color .15s,box-shadow .15s;animation:pinKey .35s calc(.12s + var(--i)*28ms) cubic-bezier(.2,1.3,.4,1) backwards}
.pin-keys button.fn{background:transparent;border-color:transparent;font-size:13px;color:var(--mut)}
.pin-keys button.fn[data-k=b]{font-size:24px}
.pin-keys button:active,.pin-keys button.press{transform:scale(.88);background:var(--grad);color:#06363e;border-color:transparent;box-shadow:0 4px 14px rgba(20,150,165,.35)}
.pin-keys button.fn:active,.pin-keys button.fn.press{background:var(--soft);color:var(--tx);box-shadow:none}
@media(hover:hover){.pin-keys button:not(.fn):hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,150,165,.18)}.pin-keys button.fn:hover{color:var(--pri2)}}
.pin-ok{margin-top:18px;width:100%;padding:14px;border:0;border-radius:40px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(8,124,140,.28);transition:opacity .2s,transform .15s,filter .15s;animation:pinKey .35s .5s backwards}
.pin-ok:hover:not(:disabled){filter:brightness(.92)}
.pin-ok:active:not(:disabled){transform:scale(.97)}
.pin-ok:disabled{opacity:.4;cursor:default;box-shadow:none}
.dk .pin-ov{background:rgba(0,0,0,.62)}
.dk .pin-card h3{color:#7fe3ee}
.dk .pin-keys button:not(.fn):active,.dk .pin-keys button:not(.fn).press{color:#06363e}
.pinfield{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border:1px solid var(--bd);border-radius:14px;background:var(--soft)}
.pinfield .pf-i{flex:1;min-width:140px;font-size:14px}
.pinfield .pf-i b{display:block;letter-spacing:3px;color:var(--pri2);font-size:15px;min-height:18px}
.dk .pinfield .pf-i b{color:#7fe3ee}
@media(max-height:640px){.pin-card{padding:22px 18px 16px}.pin-av{width:54px;height:54px;font-size:24px;margin-bottom:8px}.pin-sub{margin-bottom:12px}.pin-dots{margin-bottom:14px}.pin-keys{gap:8px}.pin-keys button{width:58px;height:58px;font-size:22px}}
@keyframes pinFade{from{opacity:0}to{opacity:1}}
@keyframes pinFadeOut{to{opacity:0}}
@keyframes pinPop{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pinPopOut{to{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes pinAv{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes pinKey{from{opacity:0;transform:translateY(12px) scale(.8)}to{opacity:1;transform:none}}
@keyframes pinShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
@keyframes pinOk{0%{transform:scale(1)}45%{transform:scale(1.7)}100%{transform:scale(1.2)}}
@keyframes pinCheck{0%{transform:scale(.3);opacity:.3}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.pin-ov,.pin-card,.pin-av,.pin-keys button,.pin-ok,.pin-dots,.pin-dots i{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
/* ---------- TELA DE SENHA DO SITE (a senha é a mesma SYNC_KEY, conferida no servidor) ---------- */
(function(){
  const KN='ponto_synckey';
  let saved='';try{saved=localStorage.getItem(KN)||''}catch(e){}
  /* cabeçalhos HTTP só aceitam ASCII: codifica para que senhas com acento/ç funcionem */
  const check=v=>fetch('/api/sync',{headers:{'x-sync-key':encodeURIComponent(v)},cache:'no-store'});
  if(saved){
    /* este aparelho já tem senha: confere em segundo plano; se o servidor disser que mudou, volta a pedir */
    check(saved).then(r=>{if(r.status===401){try{localStorage.removeItem(KN)}catch(e){}location.reload()}}).catch(()=>{});
    return;
  }
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(115deg,#2fd0b5 0%,#3cc4c9 50%,#45b5df 100%);font-family:Nunito,"Segoe UI",system-ui,sans-serif';
  o.innerHTML='<form style="background:#fff;border-radius:20px;padding:26px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 28px rgba(20,150,165,.25)"><h2 style="color:#06626f;margin:0 0 4px;font-size:20px">Ponto Eletrônico</h2><p style="color:#56727a;font-size:14px;margin:0 0 14px">Shine Rio Group · digite a senha de acesso</p><input type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Senha" style="width:100%;padding:12px;border:1px solid #d5ecec;border-radius:12px;font-size:16px"><p style="color:#b00020;font-size:13px;min-height:18px;margin:8px 0"></p><button style="width:100%;padding:13px;border:0;border-radius:30px;background:#087c8c;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Entrar</button></form>';
  document.body.appendChild(o);
  const f=o.querySelector('form'),i=f.querySelector('input'),er=f.querySelector('p:nth-of-type(2)'),bt=f.querySelector('button');
  setTimeout(()=>i.focus(),50);
  f.onsubmit=async ev=>{
    ev.preventDefault();const v=i.value.trim();if(!v)return;
    if(location.protocol==='file:'){er.textContent='Abra pelo endereço do site (https://…), não pelo arquivo do computador.';return}
    er.textContent='Verificando…';bt.disabled=true;
    try{
      const r=await check(v);
      const j=await r.json().catch(()=>null);
      if(r.status===200&&j&&typeof j==='object'&&'rev' in j){try{localStorage.setItem(KN,v)}catch(e){er.textContent='O navegador bloqueou o armazenamento (modo privado?).';return}location.reload();return}
      if(r.status===401)er.textContent='Senha incorreta.';
      else if(r.status===404||r.status===200)er.textContent='O servidor não tem a rota /api/sync (o arquivo deve ficar em api/sync.js).';
      else if(r.status===500)er.textContent=(j&&j.error)||'Servidor não configurado (variáveis SYNC_KEY e banco).';
      else if(r.status===502)er.textContent='O servidor não conseguiu acessar o banco de dados.';
      else er.textContent='Não foi possível verificar (erro '+r.status+').';
    }catch(x){er.textContent='Sem conexão com a internet.'}
    finally{bt.disabled=false}
  };
})();

<main id="app"></main>
<footer><b>A empresa de terceirização que mais cresce no Brasil!</b>Shine Rio Group · Ponto Eletrônico</footer>

<script>
const TIPOS={entrada:'Entrada',saida_almoco:'Saída p/ almoço',volta_almoco:'Volta do almoço',saida:'Saída',extra_entrada:'Entrada extra',extra_saida:'Saída extra'};
const SEQ=['entrada','saida_almoco','volta_almoco','saida'];
const SEQ2=['entrada','saida'];
const TIPOEMP={efetivo:'Efetivo',j4:'Jovem 4 horas',j6:'Jovem 6 horas'};
const hasLunch=e=>!e||e.tipo!=='j4';
const seqOf=e=>hasLunch(e)?SEQ:SEQ2;
const nOf=e=>hasLunch(e)?4:2;
const LC=k=>(k==='saida_almoco'||k==='volta_almoco')?'lc':'';
const OCORR=['Atestado médico','Falta justificada','Falta injustificada','Férias','Folga / compensação','Licença','Declaração de comparecimento','Outro'];
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIASL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const ORDEM=[1,2,3,4,5,6,0];const TOL=10;
const blank=()=>({entrada:'',saida_almoco:'',volta_almoco:'',saida:''});
let S;
try{S=JSON.parse(localStorage.getItem('ponto_v1'))}catch(e){}
if(!S)S={};
S.adminPin=S.adminPin||'1234';S.employees=S.employees||[];S.records=S.records||{};S.occurrences=S.occurrences||[];S.holidays=S.holidays||[];S.holFixed=S.holFixed||[];
S.employees.forEach(e=>{
  e.tipo=TIPOEMP[e.tipo]?e.tipo:'efetivo';
  if(!e.week){e.week={};for(let d=0;d<7;d++)e.week[d]=(d>=1&&d<=5)?Object.assign(blank(),e.sched||{}):blank();delete e.sched}
  for(let d=0;d<7;d++)e.week[d]=Object.assign(blank(),e.week[d]||{});
});
const save=()=>{S._mod=Date.now();try{localStorage.setItem('ponto_v1',JSON.stringify(S))}catch(e){}window.__syncDirty&&window.__syncDirty()};
const $=s=>document.querySelector(s);
const app=$('#app');
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const brDate=k=>{const [y,m,d]=k.split('-');return `${d}/${m}/${y}`};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m};
const fmtMin=m=>{const s=m<0?'-':'';m=Math.abs(Math.round(m));return s+Math.floor(m/60)+':'+pad(m%60)};
const cls=m=>m<0?'neg':(m>0?'pos':'');
let tick=null;
function stopTick(){const f=document.querySelector('footer b');if(f)f.hidden=false;if(tick){clearInterval(tick);tick=null}}
function clockHTML(){return `<div class="clock"><div class="t" id="ck">--:--:--</div><div class="d" id="dt"></div></div>`}
function startClock(){
  const up=()=>{const n=new Date();const a=$('#ck'),b=$('#dt');if(!a)return;
    a.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    b.textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})};
  up();tick=setInterval(up,1000);
}
function daysOf(o){
  const out=[];const a=new Date(o.ini+'T12:00:00'),b=new Date((o.fim||o.ini)+'T12:00:00');
  for(let d=a;d<=b&&out.length<400;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,12))out.push(dkey(d));
  return out;
}
function occOn(empId,key){return S.occurrences.filter(o=>o.emp===empId&&daysOf(o).includes(key))}

/* ---------- CÁLCULOS ---------- */
const punchType=(i,e)=>{const N=nOf(e);return i<N?seqOf(e)[i]:((i-N)%2===0?'extra_entrada':'extra_saida')};
function planned(e,dow){
  const s=e.week[dow]||blank();let t=0;
  const a=toMin(s.entrada),b=toMin(s.saida_almoco),c=toMin(s.volta_almoco),d=toMin(s.saida);
  if(!hasLunch(e)){if(a!=null&&d!=null&&d>a)t+=d-a;return t}
  if(a!=null&&b!=null&&b>a)t+=b-a;
  if(c!=null&&d!=null&&d>c)t+=d-c;
  return t;
}
function recsOf(id,key){return (S.records[id]||[]).filter(r=>dkey(new Date(r.ts))===key).sort((x,y)=>x.ts-y.ts)}
function dayInfo(e,key){
  const tk=dkey(new Date());
  const N=nOf(e),lunch=hasLunch(e);
  const recs=recsOf(e.id,key);
  const ms=recs.map(r=>Math.floor(r.ts/60000));
  let reg=0;if(ms.length>1)reg+=ms[1]-ms[0];if(lunch&&ms.length>3)reg+=ms[3]-ms[2];
  let ext=0;for(let i=N;i+1<ms.length;i+=2)ext+=ms[i+1]-ms[i];
  const dow=new Date(key+'T12:00:00').getDay();
  const plan=planned(e,dow);
  const occ=occOn(e.id,key);
  const hol=S.holidays.find(h=>h.data===key)||S.holFixed.find(h=>h.dm===key.slice(5));const abon=!!hol||occ.some(o=>o.tipo!=='Falta injustificada');
  const eff=abon?0:plan;
  const closed=key<tk||(key===tk&&recs.length>=N);
  const incomplete=recs.length>0&&(recs.length<N||recs.length%2===1)&&(key<tk);
  const falta=key<tk&&plan>0&&!recs.length&&!abon;
  const sc=e.week[dow],mn=i=>{const q=new Date(recs[i].ts);return q.getHours()*60+q.getMinutes()};
  let atraso=0;if(!abon&&plan>0)(lunch?[[0,'entrada'],[2,'volta_almoco']]:[[0,'entrada']]).forEach(([i,k])=>{const pv=toMin(sc[k]);if(recs[i]&&pv!=null&&mn(i)>pv+TOL)atraso+=mn(i)-pv});
  const saldo=closed?reg-eff:null;
  return {N,lunch,key,dow,recs,plan,eff,reg,ext,occ,abon,hol,atraso,incomplete,falta,saldo,closed};
}
function monthDays(m){
  const [y,mo]=m.split('-').map(Number);const tk=dkey(new Date());const out=[];
  const n=new Date(y,mo,0).getDate();
  for(let d=1;d<=n;d++){const k=`${y}-${pad(mo)}-${pad(d)}`;if(k<=tk)out.push(k)}
  return out;
}
function monthSummary(e,m){
  const s={prev:0,reg:0,ext:0,saldo:0,faltas:0,atest:0,incomp:0,atr:0,atrMin:0,ferias:0};
  monthDays(m).forEach(k=>{const d=dayInfo(e,k);
    if(d.closed){s.prev+=d.eff;s.reg+=d.reg;s.saldo+=d.saldo}
    s.ext+=d.ext;
    if(d.falta)s.faltas++;
    if(d.occ.some(o=>o.tipo==='Atestado médico'))s.atest++;
    if(d.incomplete)s.incomp++;if(d.atraso){s.atr++;s.atrMin+=d.atraso}if(d.occ.some(o=>o.tipo==='Férias'))s.ferias++;
  });
  return s;
}

/* ---------- HOME ---------- */
const firstName=n=>esc(String(n).trim().split(/\s+/)[0]);
const greet=()=>{const h=new Date().getHours();return h>=5&&h<12?'Bom dia':h>=12&&h<18?'Boa tarde':'Boa noite'};
const WAVES='<svg viewBox="0 0 800 300" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"><path d="M0 70C130 140 220 0 380 40S620 90 800 20"/><path d="M0 46C140 105 240-20 400 18S640 60 800 0"/><path d="M0 262C180 200 300 310 480 262S690 215 800 245"/><path d="M0 286C190 232 320 330 500 285S700 245 800 272"/></svg>';
function home(){
  stopTick();
  let h=`<div class="hero">${WAVES}<img src="${$('#logo').src}" alt="Shine Rio Group"><div class="slogan">A empresa de terceirização que mais cresce no Brasil!</div>${clockHTML()}</div><div class="hello"><h2>${greet()}! 👋</h2><p>Que bom ter você aqui. Toque no seu nome para registrar o ponto.</p></div>`;
  $('footer b').hidden=true;
  if(!S.employees.length)h+=`<div class="card">Nenhum funcionário cadastrado ainda. Toque em <b>Administrador</b> (PIN padrão: 1234) para cadastrar.</div>`;
  else h+=`<div class="grid">`+S.employees.map(e=>`<div class="emp" role="button" tabindex="0" data-id="${e.id}"><div class="av">${esc(e.name[0].toUpperCase())}</div><b>${esc(e.name)}</b><small>${esc(e.role||TIPOEMP[e.tipo])}</small><br><span class="go">Bater ponto</span></div>`).join('')+`</div>`;
  app.innerHTML=h;startClock();
  app.querySelectorAll('.emp').forEach(el=>{el.onclick=()=>openEmp(el.dataset.id);el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();el.click()}}});
}
/* ---------- TECLADO DE PIN ---------- */
let pinOpen=false;
function askPin(o){
  return new Promise(res=>{
    if(pinOpen){res(null);return}
    pinOpen=true;
    const auto=!!o.len,max=o.len||o.max||6,min=o.len||o.min||4;
    let v='',busy=false,closed=false;
    const prev=document.activeElement;
    const ov=document.createElement('div');ov.className='pin-ov';
    ov.innerHTML=`<div class="pin-card" role="dialog" aria-modal="true" aria-labelledby="pinT" tabindex="-1"><div class="pin-av"></div><h3 id="pinT">${esc(o.title||'PIN')}</h3><div class="pin-sub" aria-live="polite"></div><div class="pin-dots" aria-hidden="true">${'<i></i>'.repeat(max)}</div><div class="pin-keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}" aria-label="${n}">${n}</button>`).join('')}<button type="button" class="fn" data-k="x">Cancelar</button><button type="button" data-k="0" aria-label="0">0</button><button type="button" class="fn" data-k="b" aria-label="Apagar">⌫</button></div>${auto?'':`<button type="button" class="pin-ok" disabled>${esc(o.okLabel||'Confirmar')}</button>`}</div>`;
    const card=ov.firstChild,av=ov.querySelector('.pin-av'),sub=ov.querySelector('.pin-sub'),dots=ov.querySelector('.pin-dots'),ds=[...dots.children],okb=ov.querySelector('.pin-ok'),btns=[...ov.querySelectorAll('.pin-keys button')];
    av.textContent=o.avatar||'🔒';
    ds.forEach((d,i)=>d.style.setProperty('--d',i));
    btns.forEach((b,i)=>b.style.setProperty('--i',i));
    const setSub=(t,c)=>{sub.className='pin-sub'+(c?' '+c:'');sub.textContent=t};
    setSub(o.sub||'');
    const paint=()=>{ds.forEach((d,i)=>d.classList.toggle('on',i<v.length));if(okb)okb.disabled=v.length<min};
    const close=r=>{
      if(closed)return;closed=true;pinOpen=false;
      document.removeEventListener('keydown',onKey,true);
      ov.classList.add('out');res(r);
      setTimeout(()=>{ov.remove();if(!document.querySelector('.pin-ov'))document.body.classList.remove('pin-lock');try{prev&&prev.isConnected&&prev.focus()}catch(x){}},230);
    };
    const submit=()=>{
      if(busy||closed||v.length<min)return;busy=true;
      const ok=o.check?o.check(v):true;
      if(ok){
        if(o.celebrate===false){close(v);return}
        dots.classList.add('ok');card.classList.add('ok');av.textContent='✓';setSub(o.okMsg||'PIN correto!','good');
        setTimeout(()=>close(v),520);
      }else{
        if(navigator.vibrate)navigator.vibrate(180);
        dots.classList.add('err','shake');setSub(o.errMsg||'PIN incorreto. Tente novamente.','err');
        setTimeout(()=>{v='';dots.classList.remove('err','shake');paint();busy=false},480);
      }
    };
    const add=d=>{
      if(busy||closed||v.length>=max)return;
      if(sub.classList.contains('err'))setSub(o.sub||'');
      v+=d;paint();
      if(auto&&v.length===max)setTimeout(submit,150);
    };
    const back=()=>{if(busy||closed)return;v=v.slice(0,-1);paint()};
    const flash=k=>{const b=btns.find(x=>x.dataset.k===k);if(!b)return;b.classList.add('press');setTimeout(()=>b.classList.remove('press'),130)};
    function onKey(e){
      if(/^[0-9]$/.test(e.key)){e.preventDefault();flash(e.key);add(e.key)}
      else if(e.key==='Backspace'){e.preventDefault();flash('b');back()}
      else if(e.key==='Enter'){e.preventDefault();if(!auto)submit()}
      else if(e.key==='Escape'){e.preventDefault();close(null)}
      else if(e.key==='Tab'){
        const f=[...card.querySelectorAll('button:not(:disabled)')],a=document.activeElement;
        if(!f.length)return;
        if(e.shiftKey&&(a===f[0]||a===card)){e.preventDefault();f[f.length-1].focus()}
        else if(!e.shiftKey&&a===f[f.length-1]){e.preventDefault();f[0].focus()}
      }
    }
    btns.forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='x')close(null);else if(k==='b')back();else add(k)});
    if(okb)okb.onclick=submit;
    ov.addEventListener('mousedown',e=>{if(e.target===ov)close(null)});
    document.addEventListener('keydown',onKey,true);
    document.body.classList.add('pin-lock');
    document.body.appendChild(ov);
    card.focus();
  });
}

      ${ORDEM.map(d=>`<tr style="${d===dow?'background:var(--soft);font-weight:600':''}"><td>${DIAS[d]}</td>${seqOf(e).map(k=>`<td>${e.week[d][k]||'—'}</td>`).join('')}</tr>`).join('')}</table>

  <div class="row" style="margin-top:14px"><button class="btn p" id="r1">📄 PDF para imprimir</button><button class="btn p" id="r2">📁 Salvar PDFs em pastas</button><button class="btn" id="r3">🗜 Baixar .zip com pastas</button><button class="btn" id="r4">📊 Excel (.xlsx)</button></div>
  <p style="color:var(--mut);font-size:13px;margin-top:10px"><b>Salvar PDFs em pastas</b> (Chrome/Edge) grava <b>pasta escolhida / Nome do funcionário / Folha_Nome_AAAA-MM.pdf</b>; use sempre a mesma pasta e os meses vão se acumulando em cada funcionário. Em outros navegadores, use o .zip (mesma estrutura de pastas). O PDF traz um espaço para assinatura do funcionário e do responsável.</p></div>`;
  const get=()=>{const m=$('#rm').value;if(!m){alert('Escolha o mês.');return null}hMes=m;const id=$('#re').value;return {m,emps:S.employees.filter(e=>!id||e.id===id)}};
  $('#r1').onclick=()=>{const g=get();if(g)dl(new Blob([makePDF(g.emps.map(e=>folhaPage(e,g.m)))],{type:'application/pdf'}),`Folha_de_Ponto_${g.m}.pdf`)};
  $('#r3').onclick=()=>{const g=get();if(g)dl(makeZip(pdfFiles(g.emps,g.m).map(f=>({n:`Folhas_${g.m}/${f.path}`,d:f.data}))),`Folhas_${g.m}.zip`)};
  $('#r4').onclick=()=>{const g=get();if(g)exportXLSX(g.m,g.emps)};
  $('#r2').onclick=async()=>{
    const g=get();if(!g)return;
    if(!window.showDirectoryPicker)return alert('Este navegador não permite gravar em pastas. Use o botão .zip.');
    try{
      const root=await showDirectoryPicker({mode:'readwrite'}),fs=pdfFiles(g.emps,g.m);
      for(const f of fs){const [d,n]=f.path.split('/');const dir=await root.getDirectoryHandle(d,{create:true});const fh=await dir.getFileHandle(n,{create:true});const w=await fh.createWritable();await w.write(f.data);await w.close()}
      alert(fs.length+' PDF(s) salvo(s) na pasta escolhida.');
    }catch(x){if(x.name!=='AbortError')alert('Não foi possível gravar: '+x.message)}
  };
}
/* ---------- AJUSTE DE MARCAÇÕES (admin) ---------- */
let aDay=null,aEmp=null,aN=0,aTmp=null;
function ajuste(){
  if(!aDay)aDay=dkey(new Date());
  if(!aEmp||!S.employees.find(e=>e.id===aEmp))aEmp=hEmp;
  const emp=S.employees.find(e=>e.id===aEmp),N=nOf(emp),recs=recsOf(aEmp,aDay),n=Math.max(N,recs.length,aN);
  const vals=aTmp||recs.map(r=>hhmm(new Date(r.ts)));
  $('#pane').insertAdjacentHTML('beforeend',`<div class="card"><h2>Lançar ponto esquecido / corrigir marcações</h2>
  <div class="row" style="align-items:flex-start"><div class="sp"><label style="margin-top:0">Funcionário</label><select id="ae">${S.employees.map(e=>`<option value="${e.id}" ${e.id===aEmp?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
  <div class="sp"><label style="margin-top:0">Data</label><input type="date" id="ad" value="${aDay}" max="${dkey(new Date())}"></div></div>
  <p style="color:var(--mut);font-size:13px;margin:10px 0"><span class="tag">${TIPOEMP[emp.tipo]}</span> ${hasLunch(emp)?'Bate almoço.':'<b>Não bate almoço</b>.'} Preencha em ordem: ${hasLunch(emp)?'entrada, saída p/ almoço, volta do almoço e saída (a partir da 5ª, entradas/saídas extras)':'entrada e saída (a partir da 3ª, entradas/saídas extras)'}. Apague um horário para removê-lo. Ao salvar, as marcações do dia ficam exatamente como estão abaixo.</p>
  <div class="sched" style="grid-template-columns:repeat(2,1fr)">${Array.from({length:n},(_,i)=>`<div>${TIPOS[punchType(i,emp)]}<input type="time" class="at" value="${vals[i]||''}">${vals[i]?'<button type="button" class="btn d arm" style="margin-top:6px;padding:4px 10px;font-size:12px">Remover</button>':''}</div>`).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="btn" id="amais">+ marcação extra</button><button class="btn p" id="asv">Salvar marcações do dia</button><button class="btn d" id="adel">🗑 Apagar todas do dia</button></div></div>`);
  $('#ae').onchange=ev=>{aEmp=hEmp=ev.target.value;aN=0;aTmp=null;paneAjuste()};
  $('#ad').onchange=ev=>{if(ev.target.value){aDay=ev.target.value;aN=0;aTmp=null;paneAjuste()}};
  app.querySelectorAll('.arm').forEach(b=>b.onclick=()=>{
    if(!confirm('Remover esta marcação de '+emp.name+' em '+brDate(aDay)+'?'))return;
    const ins=[...app.querySelectorAll('.at')],v=ins.map(i=>i.value);v.splice(ins.indexOf(b.parentNode.querySelector('.at')),1);v.push('');
    ins.forEach((i,k)=>i.value=v[k]);$('#asv').click()});
  $('#adel').onclick=()=>{
    if(!recsOf(aEmp,aDay).length)return alert('Não há marcações neste dia.');
    if(!confirm('Apagar TODAS as marcações de '+emp.name+' em '+brDate(aDay)+'? Não dá para desfazer.'))return;
    S.records[aEmp]=(S.records[aEmp]||[]).filter(r=>dkey(new Date(r.ts))!==aDay);
    save();hMes=aDay.slice(0,7);hEmp=aEmp;aN=0;aTmp=null;admin('Marcações do dia apagadas.')};
  $('#amais').onclick=()=>{aTmp=[...app.querySelectorAll('.at')].map(i=>i.value);aN=n+2;paneAjuste()};
  $('#asv').onclick=()=>{
    if(!aDay||aDay>dkey(new Date()))return alert('Escolha uma data até hoje.');
    const raw=[...app.querySelectorAll('.at')].map(i=>i.value);
    if(raw.some((v,i)=>!v&&raw.slice(i+1).some(Boolean)))return alert('Não deixe horário vazio no meio. Preencha em ordem, a partir do primeiro campo.');
    const ts=raw.filter(Boolean).sort();
    if(new Set(ts).size!==ts.length)return alert('Há horários repetidos.');
    const [y,m,d]=aDay.split('-').map(Number),old=recsOf(aEmp,aDay);
    S.records[aEmp]=(S.records[aEmp]||[]).filter(r=>dkey(new Date(r.ts))!==aDay).concat(ts.map((t,i)=>{
      const o=old.find(r=>hhmm(new Date(r.ts))===t);if(o)return Object.assign({},o,{type:punchType(i,emp)});
      const [h,mi]=t.split(':').map(Number);return {ts:new Date(y,m-1,d,h,mi).getTime(),type:punchType(i,emp),manual:true}}));
    save();hMes=aDay.slice(0,7);hEmp=aEmp;aN=0;aTmp=null;admin('Marcações do dia salvas.');
  };
}
function paneAjuste(){
  if(!S.employees.length){$('#pane').innerHTML='<div class="card">Cadastre um funcionário primeiro.</div>';return}
  if(!hEmp||!S.employees.find(e=>e.id===hEmp))hEmp=S.employees[0].id;
  $('#pane').innerHTML='';ajuste();
}
home();
</script>
<script>
/* ===== EXTRAS v2: painel, pendências, banco de horas, comprovante, calendário, tema, bloqueio, feriados, versões automáticas ===== */
(function(){
const C=S.cfg=Object.assign({lock:60,dup:true,aviso:'',dark:false},S.cfg||{});
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
let cur='home',last=Date.now();
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>last=Date.now(),{passive:true}));
setInterval(()=>{const i=(Date.now()-last)/1000;if((cur==='profile'&&C.lock&&i>C.lock)||(cur==='admin'&&i>300))home()},5000);

/* versões automáticas (1 por dia, últimas 7) */
const snaps=()=>{try{return JSON.parse(localStorage.getItem('ponto_snaps'))||[]}catch(e){return[]}};
(function(){const k=dkey(new Date()),l=snaps();if(l.some(s=>s.d===k)||(!S.employees.length&&!Object.keys(S.records).length))return;
  l.push({d:k,t:Date.now(),data:JSON.stringify(S)});try{localStorage.setItem('ponto_snaps',JSON.stringify(l.slice(-7)))}catch(e){}})();

/* tema */
const st=document.createElement('style');
st.textContent=`body.dk{--bg:#0f1f24;--card:#172a30;--tx:#e6f2f3;--mut:#9bb4ba;--bd:#2a454e;--soft:#1f3b43}

.dk .btn.d,.dk .neg{color:#ff8a9a}.dk .pos{color:#5fd8a8}.dk .ext{color:#ffb454}.dk .emp{color:var(--tx)}
.stt{display:block;font-size:11px;margin-top:6px;font-weight:700;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:7px 0;border-radius:10px;font-size:13px;background:var(--soft)}
.cal .h{background:none;color:var(--mut);font-size:11px;font-weight:700}.cal .ok{background:#bdebd6;color:#0c4b2c}.cal .f{background:#ffc9d1;color:#7a0016}
.cal .i{background:#ffe0a8;color:#6b4200}.cal .a{background:#c8e0ff;color:#0a3a73}.cal .z{opacity:.4}.cal .hj{outline:2px solid var(--pri)}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx)}.chk input{width:auto;margin:0}
@media print{header,footer,.tabs,.btn,.big,.row:has(#back){display:none!important}body{background:#fff}}`;
document.head.appendChild(st);
const hb=document.createElement('div'),bt=document.createElement('button'),ba=$('#btnAdmin');
hb.style.cssText='display:flex;gap:8px;align-items:center';bt.id='btnTema';bt.title='Modo escuro / claro';
bt.style.cssText='background:rgba(255,255,255,.85);border-radius:30px;padding:9px 12px;font-size:16px;border:0;cursor:pointer';
const applyTheme=()=>{document.body.classList.toggle('dk',!!C.dark);bt.textContent=C.dark?'☀️':'🌙';document.querySelector('meta[name=theme-color]').content=C.dark?'#0f1f24':'#2fcdb6'};
bt.onclick=()=>{C.dark=!C.dark;save();applyTheme()};ba.parentNode.insertBefore(hb,ba);hb.append(bt,ba);
ba.onclick=async()=>{if(!await askAdminPin())return;adminTab='painel';editId=null;admin()};

/* situação de cada funcionário hoje */
function stOf(e){
  const k=dkey(new Date()),r=recsOf(e.id,k),n=r.length,N=nOf(e);
  if(n){const x=n<N?((hasLunch(e)&&n===2)?['🍽 Almoço','lunch']:['🟢 Trabalhando','on']):((n-N)%2?['🟠 Hora extra','ext']:['⚪ Encerrou','end']);return{t:x[0],k:x[1],last:hhmm(new Date(r[n-1].ts))}}
  const d=dayInfo(e,k);
  if(d.abon)return{t:'📋 Abonado',k:'ab',last:''};
  if(!d.plan)return{t:'Folga',k:'off',last:''};
  const en=toMin(e.week[d.dow].entrada);
  return en!=null&&nowMin()>en+TOL?{t:'🔴 Atrasado',k:'late',last:''}:{t:'⏳ Aguardando',k:'wait',last:''};
}
/* banco de horas acumulado (desde a 1ª marcação até ontem) */
function bank(e){
  const rs=S.records[e.id]||[];if(!rs.length)return 0;
  const st0=new Date(rs.reduce((a,r)=>Math.min(a,r.ts),Infinity)),tk=dkey(new Date());let s=0;
  for(let d=new Date(st0.getFullYear(),st0.getMonth(),st0.getDate(),12);dkey(d)<tk;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,12)){const i=dayInfo(e,dkey(d));if(i.saldo!=null)s+=i.saldo}
  return s;
}

/* ---------- HOME ---------- */
const _home=home;
home=function(){
  cur='home';_home();
  if(C.aviso)app.querySelector('.hello').insertAdjacentHTML('afterend',`<div class="msg warn" style="white-space:pre-line">📢 ${esc(C.aviso)}</div>`);
  const g=app.querySelector('.grid');if(!g)return;
  [...g.children].forEach(el=>{const e=S.employees.find(x=>x.id===el.dataset.id);if(!e)return;const s=stOf(e);
    el.querySelector('br').insertAdjacentHTML('beforebegin',`<span class="stt">${s.t}${s.last?' · '+s.last:''}</span>`)});
  if(S.employees.length>6){
    g.insertAdjacentHTML('beforebegin','<input id="qb" placeholder="🔎 Buscar meu nome..." style="margin-bottom:12px">');
    $('#qb').oninput=ev=>{const q=norm(ev.target.value);[...g.children].forEach(c=>c.style.display=norm(c.textContent).includes(q)?'':'none')};
  }
};

/* ---------- PERFIL ---------- */
const _profile=profile;
profile=function(id,msg){
  cur='profile';_profile(id,msg);
  const e=S.employees.find(x=>x.id===id);if(!e)return;
  const k=dkey(new Date()),recs=recsOf(id,k),n=recs.length,nt=punchType(n,e),pb=$('#punch'),h=pb.onclick;
  pb.onclick=()=>{const l=recs[n-1];if(C.dup&&l&&Date.now()-l.ts<120000&&!confirm('Você já registrou o ponto há menos de 2 minutos. Registrar de novo?'))return;h()};
  const pv=n<nOf(e)?e.week[new Date().getDay()][nt]:'';
  if(pv){const df=toMin(pv)-nowMin();pb.insertAdjacentHTML('afterend',`<p style="text-align:center;color:var(--mut);margin-top:8px;font-size:14px">Próxima marcação prevista: <b>${TIPOS[nt]} às ${pv}</b> ${df>0?`(faltam ${fmtMin(df)})`:`(${fmtMin(-df)} de atraso)`}</p>`)}
  /* comprovante */
  const mg=app.querySelector('.msg:not(.warn)');
  if(msg&&mg&&n){
    const r=recs[n-1],ts=new Date(r.ts),proto=crc(enc(id+'|'+r.ts)).toString(16).toUpperCase().padStart(8,'0');
    const tx=`COMPROVANTE DE REGISTRO DE PONTO\nShine Rio Group\nFuncionário: ${e.name}\nRegistro: ${TIPOS[punchType(n-1,e)]}\nData/hora: ${ts.toLocaleDateString('pt-BR')} ${hhmm(ts)}\nProtocolo: ${proto}`;
    mg.insertAdjacentHTML('afterend','<div class="row" style="justify-content:center;margin-bottom:12px"><button class="btn" id="cmp">🧾 Comprovante (compartilhar / copiar)</button></div>');
    $('#cmp').onclick=async()=>{
      try{if(navigator.share){await navigator.share({title:'Comprovante de ponto',text:tx});return}}catch(x){if(x.name==='AbortError')return}
      try{await navigator.clipboard.writeText(tx);alert('Comprovante copiado.')}catch(x){dl(new Blob([tx],{type:'text/plain'}),`comprovante_${proto}.txt`)}
    };
  }
  /* meu mês: calendário, banco de horas e folha em PDF */
  const b=bank(e);
  app.insertAdjacentHTML('beforeend',`<div class="card"><h2>Meu mês</h2>
    <div class="row" style="align-items:flex-end;margin-bottom:10px"><div class="sp"><input type="month" id="mym" value="${k.slice(0,7)}"></div><button class="btn p" id="myp">📄 Minha folha (PDF)</button></div>
    <div class="cal" id="calw"></div>
    <p style="color:var(--mut);font-size:12px;margin-top:8px">🟩 presente · 🟥 falta · 🟧 marcação incompleta · 🟦 abonado/feriado · cinza: folga</p>

  const draw=()=>{
    const mo=$('#mym').value||k.slice(0,7),[y,m]=mo.split('-').map(Number),nd=new Date(y,m,0).getDate(),f0=new Date(y,m-1,1).getDay();
    let c=DIAS.map(d=>`<div class="h">${d}</div>`).join('')+'<div style="background:none"></div>'.repeat(f0);
    for(let d=1;d<=nd;d++){const kk=`${mo}-${pad(d)}`;let q='z',tt='';
      if(kk<=k){const i=dayInfo(e,kk);q=i.falta?'f':i.incomplete?'i':(i.abon&&!i.recs.length)?'a':i.recs.length?'ok':'';tt=obsOf(i)}
      c+=`<div class="${q} ${kk===k?'hj':''}" title="${esc(tt)}">${d}</div>`}
    $('#calw').innerHTML=c;
  };
  draw();$('#mym').onchange=draw;

/* ---------- ADMIN: novas abas ---------- */
const XT={painel:['📊 Painel',panePainel],ferr:['🧰 Ferramentas',paneFerr]};

function listaDia(k){
  const E=S.employees,pg=[],per=34,X=[30,230,290,350,410,470,565];
  for(let i=0;i<Math.max(E.length,1);i+=per){
    let c='0.5 w 0.6 G\n';
    const t=(x,y,s,z,b,w)=>{s=String(s);if(w)s=clip(s,w-5,z,b);c+=`BT /F${b?2:1} ${z} Tf ${x+3} ${(842-y).toFixed(1)} Td (${T(s)}) Tj ET\n`};
    const ln=(a,b,cc,d)=>{c+=`${a} ${842-b} m ${cc} ${842-d} l S\n`};
    t(30,50,'LISTA DE PRESENÇA · Shine Rio Group',14,1);t(30,70,brDate(k)+' · '+DIASL[new Date(k+'T12:00:00').getDay()],10,0);
    ['Funcionário','Entrada','Saída alm.','Volta alm.','Saída','Assinatura / obs.'].forEach((hh,j)=>t(X[j],98,hh,8,1,X[j+1]-X[j]));
    let Y=104;ln(30,Y,565,Y);
    E.slice(i,i+per).forEach(e=>{const d=dayInfo(e,k),sl=slotsOf(d);Y+=20;
      t(X[0],Y-6,e.name,9,0,X[1]-X[0]);sl.forEach((v,j)=>v&&t(X[j+1],Y-6,v,9,0,X[j+2]-X[j+1]));

  }

}
let pDia=null;
function panePainel(){
  const E=S.employees,tk=dkey(new Date());pDia=pDia||tk;
  if(!E.length){$('#pane').innerHTML='<div class="card">Cadastre um funcionário primeiro (aba Funcionários).</div>';return}
  const ss=E.map(e=>({e,s:stOf(e)})),cnt=(...ks)=>ss.filter(x=>ks.includes(x.s.k)).length,mo=tk.slice(0,7);
  const sm=E.map(e=>({e,s:monthSummary(e,mo),b:bank(e)}));
  const tot=sm.reduce((a,x)=>({ext:a.ext+x.s.ext,f:a.f+x.s.faltas,at:a.at+x.s.atr}),{ext:0,f:0,at:0});

  $('#pane').innerHTML=`
  ${S.adminPin==='1234'?'<div class="msg warn">⚠ Você ainda usa o PIN padrão (1234). Troque em <b>🔒 Segurança</b>.</div>':''}

    <div class="wrap" style="margin-top:10px"><table><tr><th>Funcionário</th><th>Situação</th><th>Última</th><th>Entrada prev.</th></tr>
    ${ss.map(({e,s})=>`<tr><td>${esc(e.name)}</td><td>${s.t}</td><td>${s.last||'—'}</td><td>${e.week[new Date().getDay()].entrada||'—'}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Mês atual · empresa</h2>
    <div class="sched" style="grid-template-columns:repeat(3,1fr)"><div>Horas extras<b class="ext">${fmtMin(tot.ext)}</b></div><div>Faltas<b>${tot.f}</b></div><div>Atrasos<b>${tot.at}</b></div></div>
    <div class="wrap" style="margin-top:10px"><table><tr><th>Funcionário</th><th>Saldo do mês</th><th>Banco acumulado</th></tr>
    ${sm.map(x=>`<tr><td>${esc(x.e.name)}</td><td class="${cls(x.s.saldo)}">${fmtMin(x.s.saldo)}</td><td class="${cls(x.b)}"><b>${fmtMin(x.b)}</b></td></tr>`).join('')}</table></div>
    <p style="color:var(--mut);font-size:13px;margin-top:8px">Banco acumulado = soma dos saldos diários desde a 1ª marcação de cada pessoa até ontem.</p></div>
  <div class="card"><h2>Pendências (últimos 30 dias)</h2>
    ${pend.length?`<div class="wrap"><table><tr><th>Funcionário</th><th>Dia</th><th>Problema</th><th></th></tr>${pend.slice(0,80).map((x,i)=>`<tr><td>${esc(x.e.name)}</td><td>${brDate(x.k).slice(0,5)}</td><td><small>${esc(x.p.join('; '))}</small></td><td><button class="btn" data-fx="${i}">Corrigir</button></td></tr>`).join('')}</table></div>`:'<small style="color:var(--mut)">Nenhuma pendência. 🎉</small>'}</div>
  <div class="card"><h2>Lista de presença do dia</h2><div class="row" style="align-items:flex-end"><div class="sp"><input type="date" id="pd" value="${pDia}" max="${tk}"></div><button class="btn p" id="pdf">📄 Baixar PDF</button></div></div>`;
  app.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{const x=pend[+b.dataset.fx];aEmp=hEmp=x.e.id;aDay=x.k;aN=0;aTmp=null;adminTab='aj';admin();scrollTo(0,0)});
  $('#pd').onchange=ev=>{if(ev.target.value)pDia=ev.target.value};
  $('#pdf').onclick=()=>{const k=$('#pd').value||tk;dl(new Blob([listaDia(k)],{type:'application/pdf'}),`Lista_presenca_${k}.pdf`)};
}

function paneFerr(){
  const sn=snaps().slice().reverse(),man=[];
  S.employees.forEach(e=>(S.records[e.id]||[]).forEach(r=>r.manual&&man.push({e,r})));
  man.sort((a,b)=>b.r.ts-a.r.ts);
  $('#pane').innerHTML=`
  <div class="card"><h2>Aviso na tela inicial</h2><textarea id="av" rows="3" placeholder="Ex.: Reunião geral sexta, 9h. Traga o crachá.">${esc(C.aviso)}</textarea><div style="margin-top:10px"><button class="btn p" id="avs">Salvar aviso</button></div></div>
  <div class="card"><h2>Preferências</h2>
    <label style="margin-top:0">Bloqueio automático do perfil do funcionário (volta à tela inicial)</label>
    ${(()=>{const P=[[0,'Desligado'],[15,'15 segundos'],[30,'30 segundos'],[60,'1 minuto'],[120,'2 minutos'],[300,'5 minutos'],[600,'10 minutos']];const cu=!P.some(([v])=>v===+C.lock);
      return `<select id="lk">${P.map(([v,n])=>`<option value="${v}" ${!cu&&+C.lock===v?'selected':''}>${n}</option>`).join('')}<option value="x" ${cu?'selected':''}>Outro tempo…</option></select>
      <div id="lkw" style="${cu?'':'display:none'};margin-top:8px"><label style="margin-top:0">Tempo em segundos (de 5 a 3600)</label><input id="lkc" type="number" min="5" max="3600" step="1" inputmode="numeric" value="${cu?+C.lock:45}"></div>`})()}
    <label class="chk"><input type="checkbox" id="dp" ${C.dup?'checked':''}> Perguntar antes de registrar ponto repetido (menos de 2 min)</label>
    <label class="chk"><input type="checkbox" id="dk" ${C.dark?'checked':''}> Modo escuro</label>
    <div style="margin-top:12px"><button class="btn p" id="prs">Salvar preferências</button></div>
    <p style="color:var(--mut);font-size:13px;margin-top:8px">O painel do administrador volta sozinho à tela inicial após 5 minutos parado.</p></div>
  <div class="card"><h2>Versões automáticas (últimos 7 dias)</h2>
    ${sn.length?`<table>${sn.map((s,i)=>`<tr><td>${brDate(s.d)} <small style="color:var(--mut)">${new Date(s.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small></td><td><button class="btn" data-rs="${i}">Restaurar</button></td></tr>`).join('')}</table>`:'<small style="color:var(--mut)">Ainda não há versões; a primeira é criada ao abrir o site em um novo dia.</small>'}
    <p style="color:var(--mut);font-size:13px;margin-top:8px">Cópia de segurança neste navegador, para desfazer erros. Não substitui o backup na nuvem (🔒 Segurança).</p></div>
  <div class="card"><h2>Marcações lançadas manualmente</h2>
    ${man.length?`<div class="wrap"><table><tr><th>Funcionário</th><th>Data</th><th>Hora</th></tr>${man.slice(0,50).map(({e,r})=>`<tr><td>${esc(e.name)}</td><td>${new Date(r.ts).toLocaleDateString('pt-BR')}</td><td>${hhmm(new Date(r.ts))}</td></tr>`).join('')}</table></div>`:'<small style="color:var(--mut)">Nenhuma marcação manual.</small>'}
    <p style="color:var(--mut);font-size:13px;margin-top:8px">Auditoria: horários digitados pelo administrador em “✍ Lançar ponto” (últimos 50).</p></div>`;
  $('#avs').onclick=()=>{C.aviso=$('#av').value.trim();save();admin('Aviso salvo.')};
  $('#lk').onchange=()=>{$('#lkw').style.display=$('#lk').value==='x'?'':'none'};
  $('#prs').onclick=()=>{
    let lk=+$('#lk').value;
    if($('#lk').value==='x'){lk=Math.round(+$('#lkc').value);if(!(lk>=5&&lk<=3600))return alert('Digite um tempo entre 5 e 3600 segundos.')}
    C.lock=lk;C.dup=$('#dp').checked;C.dark=$('#dk').checked;save();applyTheme();admin('Preferências salvas.')};
  app.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{const s=sn[+b.dataset.rs];
    if(!confirm('Restaurar a versão de '+brDate(s.d)+'? Os dados atuais serão substituídos (uma cópia fica guardada).'))return;
    try{localStorage.setItem('ponto_pre',JSON.stringify(S));localStorage.setItem('ponto_dirty','1');localStorage.setItem('ponto_v1',s.data.replace(/\}$/,',"_mod":'+Date.now()+'}'));location.reload()}catch(x){alert('Não foi possível restaurar.')}});
}

/* ---------- FERIADOS automáticos (nacionais + RJ) ---------- */
const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return new Date(y,Math.floor((h+l-7*m+114)/31)-1,(h+l-7*m+114)%31+1,12)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);
const FIXOS=[['01-01','Confraternização Universal'],['01-20','São Sebastião (RJ)'],['04-21','Tiradentes'],['04-23','São Jorge (RJ)'],['05-01','Dia do Trabalho'],['09-07','Independência'],['10-12','N. Sra. Aparecida'],['11-02','Finados'],['11-15','Proclamação da República'],['11-20','Consciência Negra'],['12-25','Natal']];
const moveisAno=y=>{const p=easter(y);return[[addD(p,-48),'Carnaval (segunda)'],[addD(p,-47),'Carnaval (terça)'],[addD(p,-2),'Sexta-feira Santa'],[addD(p,60),'Corpus Christi']]};
(function(){
  let ch=false,n=0;
  /* fixos: valem para todos os anos; lançados uma única vez (se excluir, não voltam) */
  if(!S.holFixedSeed){
    FIXOS.forEach(([dm,nm])=>{if(!S.holFixed.some(h=>h.dm===dm))S.holFixed.push({id:'f'+dm,dm,nome:nm,auto:true})});
    /* remove cópias com ano lançadas por versões anteriores */
    const nomeDe={};FIXOS.forEach(([dm,nm])=>nomeDe[dm]=nm);
    S.holidays=S.holidays.filter(h=>!(S.holFixed.some(f=>f.dm===h.data.slice(5))&&(h.auto||nomeDe[h.data.slice(5)]===h.nome||/^(Confraternização|São Sebastião|Tiradentes|São Jorge|Dia do Trabalho|Independência|N\. Sra|Finados|Proclamação|Consciência|Natal)/.test(h.nome))));
    S.holFixedSeed=true;ch=true;
  }
  /* móveis: ano atual e próximo, uma vez por ano */
  const y0=new Date().getFullYear();S.holYears=S.holYears||[];
  [y0,y0+1].forEach(y=>{
    if(S.holYears.includes(y))return;
    moveisAno(y).forEach(([d,nm])=>{const k=dkey(d);if(!S.holidays.some(h=>h.data===k)){S.holidays.push({id:'h'+Date.now()+'_'+(n++),data:k,nome:nm,auto:true})}});
    S.holYears.push(y);ch=true;
  });
  if(ch)save();
})();

/* ---------- SINCRONIZAÇÃO (tablet <-> PC) ---------- */
(function(){
  const KEYN='ponto_synckey',REVN='ponto_rev',DN='ponto_dirty';
  let key=localStorage.getItem(KEYN)||'',rev=+localStorage.getItem(REVN)||0,busy=false,pt=null,st='';
  let dirty=localStorage.getItem(DN)==='1';
  const setDirty=v=>{dirty=v;try{v?localStorage.setItem(DN,'1'):localStorage.removeItem(DN)}catch(e){}};
  const badge=document.createElement('div');
  badge.style.cssText='position:fixed;right:8px;bottom:8px;font-size:11px;padding:3px 9px;border-radius:12px;background:#fff;border:1px solid var(--bd);color:var(--mut);z-index:5;opacity:.9;pointer-events:none';
  document.body.appendChild(badge);
  const paint=t=>{st=t;badge.hidden=!key;badge.textContent=t};
  const hm=()=>hhmm(new Date());
  async function api(method,body){
    const r=await fetch('/api/sync',{method,headers:{'x-sync-key':encodeURIComponent(key),'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
    const j=await r.json().catch(()=>({}));
    return Object.assign({status:r.status},j);
  }
  function adopt(o,r){
    const keep=C;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,o);
    Object.assign(keep,S.cfg||{});S.cfg=keep;
    S.employees=S.employees||[];S.records=S.records||{};S.occurrences=S.occurrences||[];S.holidays=S.holidays||[];S.holFixed=S.holFixed||[];
    rev=r;try{localStorage.setItem(REVN,rev);localStorage.setItem('ponto_v1',JSON.stringify(S))}catch(e){}
  }
  /* conflito (os dois mudaram ao mesmo tempo): o mais recente vence, mas nenhuma marcação de ponto se perde */
  function merge(a,b){
    const w=(a._mod||0)>=(b._mod||0)?a:b,m=JSON.parse(JSON.stringify(w));m.records={};
    m.employees.forEach(e=>{const u=new Map();
      [].concat((a.records||{})[e.id]||[],(b.records||{})[e.id]||[]).forEach(r=>u.set(r.ts+':'+r.type,r));
      m.records[e.id]=[...u.values()].sort((x,y)=>x.ts-y.ts)});
    return m;
  }
  function refresh(){
    const a=document.activeElement;
    if((a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||document.querySelector('.pin-ov'))return;
    try{if($('#pane')){if(adminTab==='painel')admin()}else if(document.querySelector('.hello'))home()}catch(e){}
  }
  async function run(){
    if(!key||busy)return;busy=true;
    try{
      const g=await api('GET');
      if(g.status===401){paint('⚠ chave inválida');return}
      if(g.status!==200)throw 0;
      let changed=false;
      if(g.data==null){rev=0}
      else if(g.rev>rev){
        if(rev===0){try{localStorage.setItem('ponto_pre',JSON.stringify(S))}catch(e){}}
        if(dirty)adopt(merge(S,g.data),g.rev);else{adopt(g.data,g.rev);setDirty(false)}
        changed=true;
      }
      if(dirty||g.data==null){
        const mod=S._mod,p=await api('PUT',{baseRev:rev,data:S});
        if(p.status===200){rev=p.rev;try{localStorage.setItem(REVN,rev)}catch(e){}if(S._mod===mod)setDirty(false)}
        else{paint('⚠ conflito, tentando de novo');clearTimeout(pt);pt=setTimeout(run,3000);return}
      }
      if(changed)refresh();
      paint('☁ sincronizado '+hm());
    }catch(e){paint('⚠ sem conexão (dados salvos neste aparelho)')}
    finally{busy=false}
  }
  window.__syncDirty=()=>{if(!key)return;setDirty(true);paint('☁ salvando…');clearTimeout(pt);pt=setTimeout(run,1500)};

  window.syncUI=function(){
    const pane=$('#pane');if(!pane)return;
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<h2>🔑 Senha de acesso e sincronização (tablet ⇄ PC)</h2>
      <p style="color:var(--mut);font-size:13px;margin-bottom:8px">${key?'Ativa neste aparelho. '+esc(st):'Desligada neste aparelho.'} Use a <b>mesma chave</b> em todos os aparelhos.</p>
      <label style="margin-top:0">Senha de acesso (a mesma em todos os aparelhos)</label><input id="sk" type="password" autocomplete="off" value="${esc(key)}">
      <div class="row" style="margin-top:10px"><button class="btn p" id="sks">Salvar e sincronizar</button>${key?'<button class="btn" id="sko">Sincronizar agora</button><button class="btn d" id="skd">Sair deste aparelho</button>':''}</div>`;
    pane.appendChild(c);
    $('#sks').onclick=async()=>{
      const k=$('#sk').value.trim();if(!k)return;
      const old=key;key=k;
      try{
        const g=await api('GET');
        if(g.status===401){key=old;return alert('Chave incorreta.')}
        if(g.status!==200)throw 0;
        if(g.data!=null&&!(old===k&&rev>0)){
          if(!confirm('A nuvem já tem dados. Substituir os dados DESTE aparelho pelos da nuvem? (uma cópia fica guardada)')){key=old;return}
          try{localStorage.setItem('ponto_pre',JSON.stringify(S))}catch(e){}
          adopt(g.data,g.rev);setDirty(false);localStorage.setItem(KEYN,key);return location.reload();
        }
        localStorage.setItem(KEYN,key);setDirty(true);await run();paneSeg();
      }catch(e){key=old;alert('Não foi possível conectar. Verifique a internet e a configuração do servidor.')}
    };
    if($('#sko'))$('#sko').onclick=async()=>{await run();paneSeg()};
    if($('#skd'))$('#skd').onclick=()=>{if(!confirm('Sair deste aparelho? A senha será pedida de novo e a sincronização para. Os dados locais continuam aqui.'))return;
      key='';rev=0;localStorage.removeItem(KEYN);localStorage.removeItem(REVN);setDirty(false);location.reload()};
  };

  if(key)paint('☁ conectando…');
  setInterval(()=>{if(!document.hidden)run()},30000);
  addEventListener('online',run);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)run()});
  run();
})();

applyTheme();home();
})();
</script>
